# Render's free plan sleeps after 15 idle minutes and takes ~50s to wake up.
# Pinging every 10 minutes keeps the API fast for customers and WhatsApp link previews.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 https://apnabazarr-backend.onrender.com/api/health
